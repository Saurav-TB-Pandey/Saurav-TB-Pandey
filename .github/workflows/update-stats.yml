name: Update GitHub Stats

on:
  schedule:
    # Daily at 00:00 UTC — keeps the profile repo active even without manual commits
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-stats.yml'
      - '.github/scripts/update-stats.js'

concurrency:
  group: update-github-stats
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync with latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update README with GitHub Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update-stats.js

      - name: Commit and push daily update
        run: |
          git add README.md .github/stats-last-run.json
          git commit -m "📊 Update GitHub stats [skip ci]"
          git pull --rebase origin main
          git push origin main

