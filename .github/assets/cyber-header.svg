<svg xmlns="http://www.w3.org/2000/svg" width="920" height="200" viewBox="0 0 920 200" role="img" aria-label="Saurav Pandey">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="920" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="50%" stop-color="#0d0d18"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="920" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7B2FFF">
        <animate attributeName="stop-color" values="#7B2FFF;#00F0FF;#7B2FFF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#FF00AA;#00F0FF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7B2FFF">
        <animate attributeName="stop-color" values="#7B2FFF;#00F0FF;#7B2FFF" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#00F0FF" stroke-width="0.25" opacity="0.12"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="12" y="12" width="896" height="176" rx="2"/></clipPath>
  </defs>
  <rect width="920" height="200" fill="url(#bg)"/>
  <rect width="920" height="200" fill="url(#grid)"/>
  <g clip-path="url(#frame)">
    <line x1="0" y1="0" x2="920" y2="0" stroke="url(#neon)" stroke-width="2" opacity="0.8">
      <animate attributeName="y1" values="0;200;0" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="0;200;0" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.35;0" dur="2.8s" repeatCount="indefinite"/>
    </line>
  </g>
  <path d="M12 32V12H32M888 12h20v20M888 168v20H868M32 188H12v-20" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0.9"/>
  <path d="M40 12h120M760 12h120M40 188h80M800 188h80" fill="none" stroke="#7B2FFF" stroke-width="1" opacity="0.5"/>
  <text x="48" y="36" font-family="monospace" font-size="9" fill="#00F0FF" opacity="0.7">SYS://DEV/PROFILE</text>
  <text x="872" y="36" text-anchor="end" font-family="monospace" font-size="9" fill="#7B2FFF" opacity="0.7">v3.0.26</text>
  <circle cx="860" cy="28" r="4" fill="#00FF88">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="848" y="32" text-anchor="end" font-family="monospace" font-size="8" fill="#00FF88">ONLINE</text>
  <text x="460" y="95" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#00F0FF" filter="url(#glow)">SAURAV PANDEY</text>
  <text x="462" y="97" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="#FF00AA" opacity="0.25">SAURAV PANDEY
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="0.15s" repeatCount="indefinite"/>
    <animate attributeName="x" values="458;464;460" dur="0.12s" repeatCount="indefinite"/>
  </text>
  <text x="460" y="125" text-anchor="middle" font-family="monospace" font-size="11" fill="#7B2FFF" letter-spacing="5">FULL STACK DEVELOPER</text>
  <text x="460" y="148" text-anchor="middle" font-family="monospace" font-size="9" fill="#00F0FF" opacity="0.65">MERN  /  AWS  /  MICROSERVICES  /  REAL-TIME SYSTEMS</text>
  <rect x="280" y="162" width="360" height="3" fill="#1a1a2e"/>
  <rect x="280" y="162" width="0" height="3" fill="url(#neon)">
    <animate attributeName="width" values="0;360;0" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="460" y="180" text-anchor="middle" font-family="monospace" font-size="8" fill="#00F0FF" opacity="0.5">INITIALIZING NEURAL INTERFACE...</text>
</svg>
